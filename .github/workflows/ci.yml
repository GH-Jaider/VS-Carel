name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads packageManager from the root package.json, so the pnpm version
      # is pinned in one place only.
      - uses: pnpm/action-setup@v6

      # Same idea for Node: the supported range lives in engines.node and
      # setup-node resolves it, so CI cannot drift from what we claim to run on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      # The root `prepare` script builds the core here, which is what makes the
      # steps below work on a clone with no dist/ checked in.
      - run: pnpm install --frozen-lockfile

      # Cheapest checks first: neither needs a build, so a misformatted or
      # lint-broken PR fails in seconds instead of after the whole pipeline.
      - run: pnpm format:check
      - run: pnpm lint

      # Topological order comes from the workspace:* dependencies, so the core
      # is always built before the shells that bundle it.
      - run: pnpm build

      # Both consume the core's emitted types, hence after the build.
      - run: pnpm typecheck
      - run: pnpm test
