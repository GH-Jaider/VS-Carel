<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};"
    />
    <title>Karel World</title>
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body>
    <div id="errorBanner" class="error-banner hidden"></div>

    <div class="canvas-container">
      <canvas id="worldCanvas"></canvas>
      <div id="emptyState" class="empty-state">
        <p>This world could not be drawn yet.</p>
        <p>Fix the file (click <code>{}</code> above to edit the JSON), or press <kbd>F5</kbd> in a <code>.kli</code> program.</p>
      </div>
    </div>

    <div class="status-line">
      <span id="statusText" class="status-state">Ready</span>
      <span class="sep">·</span>
      <span>Karel <span id="position">–</span> <span id="facing"></span></span>
      <span class="sep">·</span>
      <span>Bag: <span id="beepers">–</span></span>
    </div>

    <script src="{{scriptUri}}"></script>
  </body>
</html>
