<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Every node carrying a data-i18n* attribute is filled in from the
         catalogue in src/i18n.ts before first paint and again on every
         language change; the English here is what a visitor sees if the
         module never runs at all. -->
    <title data-i18n="page.title">Karel the Robot · a robot on a grid, in your browser</title>
    <meta
      name="description"
      data-i18n-content="page.description"
      content="Write Karel programs in the browser and watch the robot walk the grid, pick up beepers and turn off. A guided course, a collection of levels, a map editor, and a link you can share."
    />
    <meta name="theme-color" content="#0c0c12" />

    <!-- The icon, drawn by hand: Karel's triangle at rest on a grid, with one
         beeper on a corner. The SVG carries a light variant for light browser
         chrome; the PNG is there for anything that will not take an SVG icon,
         and the touch icon insets the same artwork so iOS can round the
         corners off empty ground. Root-absolute paths, which Vite rewrites to
         the "/karel/" production base. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- This product is, mostly, a link somebody pastes into a chat window or
         onto a slide, and everything below is what that paste looks like.
         Deliberately not translated: a crawler fetches the page once, without
         running any of its JavaScript, so there is no locale to read and an
         empty card would be the only other outcome.

         The image URL has to be absolute -- a crawler does not resolve a
         relative one against a page it never rendered -- so it names the
         deployment directly rather than going through Vite's base. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Karel" />
    <meta property="og:title" content="Karel · a robot on a grid" />
    <meta
      property="og:description"
      content="Write Karel programs in the browser and watch the robot walk the grid, pick up beepers and turn off. A guided course, a collection of levels, a map editor, and a link you can share."
    />
    <meta property="og:url" content="https://gh-jaider.github.io/karel/" />
    <meta property="og:image" content="https://gh-jaider.github.io/karel/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Karel workbench: a program in the editor with the running line lit, and the robot part-way across a ten-by-eight grid of walls and beepers."
    />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Karel · a robot on a grid" />
    <meta
      name="twitter:description"
      content="Write Karel programs in the browser and watch the robot walk the grid, pick up beepers and turn off."
    />
    <meta name="twitter:image" content="https://gh-jaider.github.io/karel/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Karel workbench: a program in the editor with the running line lit, and the robot part-way across a ten-by-eight grid of walls and beepers."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script>
      // Runs before first paint so a stored theme never flashes the default
      // palette on the way in. Deliberately tiny and dependency-free.
      try {
        var t = localStorage.getItem("karel.theme");
        // Checked against the known set: a theme that has since been renamed
        // would otherwise leave the page on an attribute nothing styles and
        // no swatch matches.
        if (["charm", "onyx", "ember", "paper"].indexOf(t) >= 0) {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
      try {
        // Same idea for the language, as far as it can go without the
        // catalogue: the document declares what it is in before anything
        // reads it. The words themselves are the module's job.
        var l = localStorage.getItem("karel.locale");
        if (["en", "es"].indexOf(l) >= 0) {
          document.documentElement.lang = l;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="frame">
      <header class="masthead">
        <div class="identity">
          <h1 class="visually-hidden" data-i18n="page.title">
            Karel the Robot · a robot on a grid, in your browser
          </h1>
          <span class="wordmark" aria-hidden="true">KAREL</span>
          <span class="subtitle" data-i18n="masthead.subtitle">a robot on a grid</span>
        </div>

        <!-- Filled by the chrome: one .channel button per mode. The three of
             them are what this page is: a guided course, a collection of
             levels, and a free world. Exactly one is active at a time. -->
        <nav class="channels" id="modes" data-i18n-aria="masthead.modes" aria-label="Modes"></nav>

        <div class="masthead-end">
          <!-- Filled by the chrome: one .lang-option per language. -->
          <div
            class="langs"
            id="langs"
            role="group"
            data-i18n-aria="masthead.languages"
            aria-label="Language"
          >
            <span class="langs-label" data-i18n="masthead.language">lang</span>
          </div>
          <!-- Filled by the renderer: one .skin-swatch per pack, each one a
               miniature the pack draws with its own hand. A pack decides the
               shapes on the canvas; the theme beside it decides the colours,
               and the two are chosen independently on purpose. -->
          <div
            class="skins"
            id="skins"
            role="group"
            data-i18n-aria="masthead.skins"
            aria-label="Map skin"
          >
            <span class="skins-label" data-i18n="masthead.skin">skin</span>
          </div>
          <!-- Filled by the chrome: one .theme-swatch per palette. -->
          <div
            class="themes"
            id="themes"
            role="group"
            data-i18n-aria="masthead.themes"
            aria-label="Colour theme"
          >
            <span class="themes-label" data-i18n="masthead.theme">theme</span>
          </div>
          <button
            class="ghost-button"
            id="share-link"
            type="button"
            data-i18n-title="masthead.shareTitle"
            title="Copy a link that opens this program and this world"
          >
            <span class="key-cap" aria-hidden="true">↺</span
            ><span data-i18n="masthead.share">share</span>
          </button>
          <!-- Shown only when the clipboard refuses: a link nobody can copy is
               not a share, so there has to be something to select. -->
          <input
            class="share-url"
            id="share-url"
            type="text"
            readonly
            hidden
            data-i18n-aria="masthead.shareUrl"
            aria-label="Link to this program and world"
          />
          <button class="ghost-button" id="about-button" type="button">
            <span class="key-cap" aria-hidden="true">?</span
            ><span data-i18n="masthead.about">how it works</span>
          </button>
        </div>
      </header>

      <main class="bench" id="bench" data-layout="plain" data-mode="sandbox">
        <!-- The guide. A third column rather than a panel over the editor,
             because the lesson, the program and the world all have to be
             readable at the same moment: the whole act of learning here is
             reading a paragraph, changing a line and watching the robot. It
             is absent in sandbox, where there is nothing to guide.

             Filled by the chrome, which decides what a guide is per mode:
             the chapter in learn, the brief in a level, the form when a
             level is being sent. -->
        <aside
          class="guide"
          id="guide"
          data-i18n-aria="guide.group"
          aria-label="The lesson and the task"
          hidden
        >
          <!-- Written by the chrome, which is the only thing that knows whether
               this column is a lesson, a level or a form. -->
          <span class="box-title" id="guide-title">lesson</span>
          <span class="box-note" id="guide-note"></span>
          <div class="guide-scroll" id="guide-body" tabindex="0"></div>
        </aside>

        <section class="workshop">
          <div class="editor">
            <span class="box-title" data-i18n="panel.program">program</span>
            <span class="box-note" id="program-note"></span>
            <!-- CodeMirror mounts here and is the only thing allowed to own it. -->
            <div class="editor-host" id="editor-host"></div>
          </div>

          <div class="panel problems">
            <span class="panel-title" data-i18n="panel.problems">problems</span>
            <span class="panel-note" id="problems-note"></span>
            <div class="panel-body">
              <!-- Filled by the chrome: one .problem per diagnostic. Kept as a
                   separate node from the panel so a rebuild cannot wipe the
                   title chip cut into the border. -->
              <div class="problem-list" id="problems"></div>
            </div>
          </div>
        </section>

        <section class="stage">
          <div class="viewport" id="viewport">
            <span class="box-title" data-i18n="panel.world">world</span>
            <span class="box-note" id="world-note"></span>
            <canvas
              id="world-canvas"
              role="img"
              aria-label="Karel's world"
              aria-describedby="readout"
            ></canvas>
          </div>

          <div class="console">
            <div class="transport" role="group" aria-label="Transport">
              <button class="transport-button primary" id="run" type="button">
                <span class="glyph" id="run-glyph" aria-hidden="true">▶</span
                ><span id="run-label">run</span>
              </button>
              <button
                class="transport-button"
                id="step"
                type="button"
                data-i18n-title="transport.stepTitle"
                title="Execute one instruction"
              >
                <span class="glyph" aria-hidden="true">▶❚</span
                ><span data-i18n="transport.step">step</span>
              </button>
              <button
                class="transport-button"
                id="reset"
                type="button"
                data-i18n-title="transport.resetTitle"
                title="Put the world back as it started"
              >
                <span class="glyph" aria-hidden="true">↺</span
                ><span data-i18n="transport.reset">reset</span>
              </button>
            </div>

            <div class="rate">
              <span class="rate-label" data-i18n="speed.label">speed</span>
              <!-- Filled by the chrome: one .rate-option per speed. -->
              <div
                class="rate-options"
                id="rate-options"
                role="group"
                data-i18n-aria="speed.label"
                aria-label="Speed"
              ></div>
            </div>

            <!-- Files. Dropping a .klm on the page still works and is still
                 the fastest way in, but it is invisible until someone tries
                 it and impossible on a phone, so the same two formats get a
                 button apiece. One opener for both: the extension decides
                 what a file is, exactly as it does for a drop, and a picker
                 that offers one button is easier to use on a small screen
                 than two that each refuse half the files. -->
            <div
              class="files"
              id="files"
              role="group"
              data-i18n-aria="files.group"
              aria-label="Files"
            >
              <span class="files-label" data-i18n="files.label">files</span>
              <button
                class="ghost-button"
                id="open-file"
                type="button"
                data-i18n-title="files.openTitle"
                title="Open a .kli program or a .klm world from this device"
              >
                <span class="key-cap" aria-hidden="true">↑</span
                ><span data-i18n="files.open">open</span>
              </button>
              <!-- The button in front of it is the control; this is the input
                   it clicks. `accept` names both extensions and the two MIME
                   types a browser is likely to guess for them, since a phone
                   that recognises neither offers nothing at all. -->
              <!-- No class of its own: it is `hidden`, the button in front of
                   it is the control, and a class the stylesheet never mentions
                   is a name that means nothing. -->
              <input
                id="file-input"
                type="file"
                hidden
                accept=".kli,.klm,application/json,text/plain"
                data-i18n-aria="files.openTitle"
                aria-label="Open a .kli program or a .klm world from this device"
              />
              <button
                class="ghost-button"
                id="save-program"
                type="button"
                data-i18n-title="files.saveProgramTitle"
                title="Download the program as a .kli file"
              >
                <span class="key-cap" aria-hidden="true">↓</span
                ><span data-i18n="files.saveProgram">save .kli</span>
              </button>
              <button
                class="ghost-button"
                id="save-world"
                type="button"
                data-i18n-title="files.saveWorldTitle"
                title="Download the world as a .klm file"
              >
                <span class="key-cap" aria-hidden="true">↓</span
                ><span data-i18n="files.saveWorld">save .klm</span>
              </button>
              <!-- What just happened to a file, for a few seconds. The palette
                   has a chip of its own, but it is only on screen in edit
                   mode and saving a program is not an edit-mode act. -->
              <span class="file-note" id="file-note" role="status"></span>
            </div>

            <!-- The mode switch is markup because it is not a view option: it
                 decides whether the canvas is a readout or an instrument. The
                 chrome appends the view toggles after it. -->
            <div class="toggles" id="toggles" role="group" aria-label="View">
              <button
                class="toggle"
                id="mode-toggle"
                type="button"
                aria-pressed="false"
                data-i18n="toggle.editMap"
                data-i18n-title="toggle.editMapTitle"
                title="Build the world by hand"
              >
                edit map
              </button>
            </div>
          </div>

          <!-- The map editor. Hidden until the mode toggle turns it on, because
               every control in it acts on a world that is not running. -->
          <section
            class="palette"
            id="palette"
            data-i18n-aria="palette.group"
            aria-label="Map editor"
            hidden
          >
            <span class="box-title" data-i18n="panel.map">map</span>
            <span class="box-note" id="palette-note"></span>

            <div class="palette-row">
              <span class="palette-label" data-i18n="palette.tool">tool</span>
              <div
                class="tools"
                id="tools"
                role="group"
                data-i18n-aria="palette.tools"
                aria-label="Tool"
              >
                <button class="tool" id="tool-wall" type="button" data-tool="wall">
                  <span class="glyph" aria-hidden="true">┃</span
                  ><span data-i18n="palette.toolWall">wall</span>
                </button>
                <button class="tool" id="tool-beeper" type="button" data-tool="beeper">
                  <span class="glyph" aria-hidden="true">●</span
                  ><span data-i18n="palette.toolBeeper">beeper</span>
                </button>
                <button class="tool" id="tool-karel" type="button" data-tool="karel">
                  <span class="glyph" aria-hidden="true">▲</span
                  ><span data-i18n="palette.toolKarel">karel</span>
                </button>
              </div>
              <span class="palette-hint" id="tool-hint"></span>
            </div>

            <div class="palette-row">
              <span class="palette-label" data-i18n="palette.size">size</span>
              <div class="stepper">
                <button
                  class="stepper-button"
                  id="width-down"
                  type="button"
                  data-target="world-width"
                  data-step="-1"
                  data-i18n-aria="palette.narrower"
                  aria-label="Narrower"
                >
                  -
                </button>
                <input
                  class="number"
                  id="world-width"
                  type="number"
                  min="1"
                  max="100"
                  step="1"
                  inputmode="numeric"
                  data-i18n-aria="palette.width"
                  aria-label="World width"
                />
                <button
                  class="stepper-button"
                  id="width-up"
                  type="button"
                  data-target="world-width"
                  data-step="1"
                  data-i18n-aria="palette.wider"
                  aria-label="Wider"
                >
                  +
                </button>
              </div>

              <span class="palette-times">×</span>

              <div class="stepper">
                <button
                  class="stepper-button"
                  id="height-down"
                  type="button"
                  data-target="world-height"
                  data-step="-1"
                  data-i18n-aria="palette.shorter"
                  aria-label="Shorter"
                >
                  -
                </button>
                <input
                  class="number"
                  id="world-height"
                  type="number"
                  min="1"
                  max="100"
                  step="1"
                  inputmode="numeric"
                  data-i18n-aria="palette.height"
                  aria-label="World height"
                />
                <button
                  class="stepper-button"
                  id="height-up"
                  type="button"
                  data-target="world-height"
                  data-step="1"
                  data-i18n-aria="palette.taller"
                  aria-label="Taller"
                >
                  +
                </button>
              </div>

              <span class="palette-label" data-i18n="palette.bag">bag</span>
              <div class="stepper">
                <button
                  class="stepper-button"
                  id="bag-down"
                  type="button"
                  data-target="karel-bag"
                  data-step="-1"
                  data-i18n-aria="palette.bagFewer"
                  aria-label="One beeper fewer"
                >
                  -
                </button>
                <input
                  class="number"
                  id="karel-bag"
                  type="number"
                  min="0"
                  max="999"
                  step="1"
                  inputmode="numeric"
                  data-i18n-aria="palette.bagField"
                  aria-label="Beepers in Karel's bag"
                />
                <button
                  class="stepper-button"
                  id="bag-up"
                  type="button"
                  data-target="karel-bag"
                  data-step="1"
                  data-i18n-aria="palette.bagMore"
                  aria-label="One beeper more"
                >
                  +
                </button>
              </div>
            </div>

            <div class="palette-row">
              <button
                class="palette-button"
                id="clear-beepers"
                type="button"
                data-i18n="palette.clearBeepers"
              >
                clear beepers
              </button>
              <button
                class="palette-button"
                id="clear-walls"
                type="button"
                data-i18n="palette.clearWalls"
              >
                clear walls
              </button>
              <span class="palette-spacer"></span>
              <button
                class="palette-button"
                id="format-map"
                type="button"
                data-i18n="palette.format"
                data-i18n-title="palette.formatTitle"
                title="Lay the file out again, the way the canvas writes it"
              >
                format
              </button>
            </div>

            <!-- The map as text: the same .klm the CLI grades, open for
                 editing. Two boxes side by side, because a file that will not
                 load has to say why somewhere, and the program's problems
                 panel is the shape this page already uses for that. -->
            <div class="map-source">
              <div class="source-box">
                <span class="box-title" data-i18n="panel.mapSource">map source</span>
                <!-- The format, stated where the text is, so nobody has to
                     guess which of the two files this one is. Not translated
                     and not rewritten: ".klm" is the extension in every
                     language. -->
                <span class="box-note">.klm</span>
                <!-- CodeMirror mounts here and is the only thing allowed to
                     own it. -->
                <div class="source-host" id="map-source-host"></div>
              </div>

              <div class="panel map-problems">
                <span class="panel-title" data-i18n="panel.problems">problems</span>
                <span class="panel-note" id="map-problems-note"></span>
                <div class="panel-body">
                  <!-- Filled by the chrome: one .problem per fault, exactly as
                       the program's panel is filled. -->
                  <div class="problem-list" id="map-problems"></div>
                </div>
              </div>
            </div>
          </section>

          <!-- Filled by the chrome: .panel blocks of readings. -->
          <aside
            class="readout"
            id="readout"
            data-i18n-aria="panel.readout"
            aria-label="Readings"
          ></aside>
        </section>

        <!-- The level gallery. It takes the whole bench rather than living in
             the guide column, because choosing between fifteen worlds is a
             browsing act and a 360-pixel rail is the wrong shape for it. The
             workbench comes back the moment a level is opened. -->
        <section
          class="gallery"
          id="gallery"
          data-i18n-aria="levels.group"
          aria-label="Levels"
          hidden
        >
          <span class="box-title" data-i18n="levels.title">levels</span>
          <span class="box-note" id="gallery-note"></span>
          <div class="gallery-scroll" id="gallery-body" tabindex="0"></div>
        </section>
      </main>

      <footer class="statusbar">
        <!-- The word after each chord is its own node so it can be translated
             without the key caps around it going through innerHTML. -->
        <span class="hint"
          ><b data-mod>ctrl</b>+<b>enter</b> <span data-i18n="hint.run">run</span></span
        >
        <span class="hint"
          ><b data-mod>ctrl</b>+<b>.</b> <span data-i18n="hint.step">step</span></span
        >
        <span class="hint"><b>esc</b> <span data-i18n="hint.stop">stop</span></span>
        <span class="hint"><b>r</b> <span data-i18n="hint.reset">reset</span></span>
        <!-- Hidden by the chrome wherever the world is not the visitor's to
             change: a chapter's world is fixed, and a key hint for a key that
             does nothing is worse than no hint. -->
        <span class="hint" id="hint-edit"
          ><b>e</b> <span data-i18n="hint.editMap">edit map</span></span
        >
        <span class="hint"><b>1-3</b> <span data-i18n="hint.mode">mode</span></span>
        <span class="hint"><b>?</b> <span data-i18n="hint.help">help</span></span>
        <span class="statusbar-end" id="status" data-state="idle">idle</span>
      </footer>
    </div>

    <!-- The manual. Long enough to need its own scroll and its own index, and
         both live inside #about-content: help.ts fills it with a fixed list of
         sections beside the document that scrolls past them. -->
    <dialog class="about" id="about" aria-labelledby="about-title">
      <article class="about-body">
        <header class="about-head">
          <h2 id="about-title" data-i18n="about.title">how it works</h2>
          <button
            class="ghost-button"
            id="about-close"
            type="button"
            data-i18n="about.close"
            aria-label="Close"
          >
            esc
          </button>
        </header>
        <div class="about-scroll" id="about-content"></div>
      </article>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
