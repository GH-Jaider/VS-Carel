<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Karel · a robot on a grid</title>
    <meta
      name="description"
      content="Karel the Robot in the browser. Write a program, watch it walk the grid, pick up the beepers, build your own world."
    />
    <meta name="theme-color" content="#0c0c12" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script>
      // Runs before first paint so a stored theme never flashes the default
      // palette on the way in. Deliberately tiny and dependency-free.
      try {
        var t = localStorage.getItem("karel.theme");
        // Checked against the known set: a theme that has since been renamed
        // would otherwise leave the page on an attribute nothing styles and
        // no swatch matches.
        if (["charm", "onyx", "ember", "paper"].indexOf(t) >= 0) {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="frame">
      <header class="masthead">
        <div class="identity">
          <span class="wordmark">KAREL</span>
          <span class="subtitle">a robot on a grid</span>
        </div>

        <!-- Filled by the chrome: one .channel button per bundled world. -->
        <nav class="channels" id="worlds" aria-label="Worlds"></nav>

        <div class="masthead-end">
          <!-- Filled by the chrome: one .theme-swatch per palette. -->
          <div class="themes" id="themes" role="group" aria-label="Colour theme">
            <span class="themes-label">theme</span>
          </div>
          <button
            class="ghost-button"
            id="share-link"
            type="button"
            title="Copy a link that opens this program and this world"
          >
            <span class="key-cap">↺</span>share
          </button>
          <!-- Shown only when the clipboard refuses: a link nobody can copy is
               not a share, so there has to be something to select. -->
          <input
            class="share-url"
            id="share-url"
            type="text"
            readonly
            hidden
            aria-label="Link to this program and world"
          />
          <button class="ghost-button" id="about-button" type="button">
            <span class="key-cap">?</span>how it works
          </button>
        </div>
      </header>

      <main class="bench">
        <section class="workshop">
          <div class="editor">
            <span class="box-title">program</span>
            <span class="box-note" id="program-note"></span>
            <!-- CodeMirror mounts here and is the only thing allowed to own it. -->
            <div class="editor-host" id="editor-host"></div>
          </div>

          <div class="panel problems">
            <span class="panel-title">problems</span>
            <span class="panel-note" id="problems-note"></span>
            <div class="panel-body">
              <!-- Filled by the chrome: one .problem per diagnostic. Kept as a
                   separate node from the panel so a rebuild cannot wipe the
                   title chip cut into the border. -->
              <div class="problem-list" id="problems"></div>
            </div>
          </div>
        </section>

        <section class="stage">
          <div class="viewport" id="viewport">
            <span class="box-title">world</span>
            <span class="box-note" id="world-note"></span>
            <canvas id="world-canvas"></canvas>
          </div>

          <div class="console">
            <div class="transport">
              <button
                class="transport-button primary"
                id="run"
                type="button"
                aria-label="Run or stop"
              >
                <span class="glyph" id="run-glyph">▶</span><span id="run-label">run</span>
              </button>
              <button
                class="transport-button"
                id="step"
                type="button"
                title="Execute one instruction"
              >
                <span class="glyph">▶❚</span><span>step</span>
              </button>
              <button
                class="transport-button"
                id="reset"
                type="button"
                title="Put the world back as it started"
              >
                <span class="glyph">↺</span><span>reset</span>
              </button>
            </div>

            <div class="rate">
              <span class="rate-label">speed</span>
              <!-- Filled by the chrome: one .rate-option per speed. -->
              <div class="rate-options" id="rate-options"></div>
            </div>

            <!-- The mode switch is markup because it is not a view option: it
                 decides whether the canvas is a readout or an instrument. The
                 chrome appends the view toggles after it. -->
            <div class="toggles" id="toggles">
              <button
                class="toggle"
                id="mode-toggle"
                type="button"
                aria-pressed="false"
                title="Build the world by hand"
              >
                edit map
              </button>
            </div>
          </div>

          <!-- The map editor. Hidden until the mode toggle turns it on, because
               every control in it acts on a world that is not running. -->
          <section class="palette" id="palette" aria-label="Map editor" hidden>
            <span class="box-title">map</span>
            <span class="box-note" id="palette-note"></span>

            <div class="palette-row">
              <span class="palette-label">tool</span>
              <div class="tools" id="tools" role="group" aria-label="Tool">
                <button class="tool" id="tool-wall" type="button" data-tool="wall">
                  <span class="glyph">┃</span>wall
                </button>
                <button class="tool" id="tool-beeper" type="button" data-tool="beeper">
                  <span class="glyph">●</span>beeper
                </button>
                <button class="tool" id="tool-karel" type="button" data-tool="karel">
                  <span class="glyph">▲</span>karel
                </button>
              </div>
              <span class="palette-hint" id="tool-hint"></span>
            </div>

            <div class="palette-row">
              <span class="palette-label">size</span>
              <div class="stepper">
                <button
                  class="stepper-button"
                  id="width-down"
                  type="button"
                  data-target="world-width"
                  data-step="-1"
                  aria-label="Narrower"
                >
                  -
                </button>
                <input
                  class="number"
                  id="world-width"
                  type="number"
                  min="1"
                  max="100"
                  step="1"
                  inputmode="numeric"
                  aria-label="World width"
                />
                <button
                  class="stepper-button"
                  id="width-up"
                  type="button"
                  data-target="world-width"
                  data-step="1"
                  aria-label="Wider"
                >
                  +
                </button>
              </div>

              <span class="palette-times">×</span>

              <div class="stepper">
                <button
                  class="stepper-button"
                  id="height-down"
                  type="button"
                  data-target="world-height"
                  data-step="-1"
                  aria-label="Shorter"
                >
                  -
                </button>
                <input
                  class="number"
                  id="world-height"
                  type="number"
                  min="1"
                  max="100"
                  step="1"
                  inputmode="numeric"
                  aria-label="World height"
                />
                <button
                  class="stepper-button"
                  id="height-up"
                  type="button"
                  data-target="world-height"
                  data-step="1"
                  aria-label="Taller"
                >
                  +
                </button>
              </div>

              <span class="palette-label">bag</span>
              <div class="stepper">
                <button
                  class="stepper-button"
                  id="bag-down"
                  type="button"
                  data-target="karel-bag"
                  data-step="-1"
                  aria-label="One beeper fewer"
                >
                  -
                </button>
                <input
                  class="number"
                  id="karel-bag"
                  type="number"
                  min="0"
                  max="999"
                  step="1"
                  inputmode="numeric"
                  aria-label="Beepers in Karel's bag"
                />
                <button
                  class="stepper-button"
                  id="bag-up"
                  type="button"
                  data-target="karel-bag"
                  data-step="1"
                  aria-label="One beeper more"
                >
                  +
                </button>
              </div>
            </div>

            <div class="palette-row">
              <button class="palette-button" id="clear-beepers" type="button">clear beepers</button>
              <button class="palette-button" id="clear-walls" type="button">clear walls</button>
              <span class="palette-spacer"></span>
              <button
                class="palette-button"
                id="export-world"
                type="button"
                title="Download this world as a .klm file"
              >
                export .klm
              </button>
            </div>
          </section>

          <!-- Filled by the chrome: .panel blocks of readings. -->
          <aside class="readout" id="readout" aria-label="Readings"></aside>
        </section>
      </main>

      <footer class="statusbar">
        <span class="hint"><b data-mod>ctrl</b>+<b>enter</b> run</span>
        <span class="hint"><b data-mod>ctrl</b>+<b>.</b> step</span>
        <span class="hint"><b>esc</b> stop</span>
        <span class="hint"><b>r</b> reset</span>
        <span class="hint"><b>e</b> edit map</span>
        <span class="hint"><b>1-4</b> world</span>
        <span class="hint"><b>?</b> help</span>
        <span class="statusbar-end" id="status" data-state="idle">idle</span>
      </footer>
    </div>

    <dialog class="about" id="about">
      <article class="about-body">
        <header>
          <h2>how it works</h2>
          <button class="ghost-button" id="about-close" type="button">esc</button>
        </header>
        <div id="about-content"></div>
      </article>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
